#
# [Units] and [Labels] follow the language file of the skin Seasons. [Texts] holds the
# words of the display. station.json carries all of [Texts], so the display needs no
# new firmware for a new language or a better word.

[Units]
    [[Labels]]
        meter = " m"
        day = " Tag", " Tage"
        hour = " Stunde", " Stunden"
        minute = " Minute", " Minuten"
        second = " Sekunde", " Sekunden"

    [[Ordinates]]
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Labels]
    [[Generic]]
        altimeter   = Luftdruck (QNH)
        appTemp     = Gefühlt
        barometer   = Luftdruck
        cloudbase   = Wolkenbasis
        dewpoint    = Taupunkt
        ET          = Verdunstung
        heatindex   = Hitzeindex
        inHumidity  = Raumluftfeuchte
        inTemp      = Raumtemperatur
        outHumidity = Luftfeuchte
        outTemp     = Außentemperatur
        pressure    = Luftdruck (QFE)
        radiation   = Sonnenstrahlung
        rain        = Regen
        rainRate    = Regenrate
        UV          = UV-Index
        windchill   = Windchill
        windDir     = Windrichtung
        windGust    = Böe
        windSpeed   = Wind

[Texts]
    # How the display writes a number. WeeWX formats with a point; the display swaps it.
    decimal_separator = ","

    # The words of the calendar, Sunday first.
    weekdays = So, Mo, Di, Mi, Do, Fr, Sa
    weekdays_long = Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag
    months = Jan, Feb, Mär, Apr, Mai, Jun, Jul, Aug, Sep, Okt, Nov, Dez
    # A date: {w} the weekday, {d} the day, {m} the month.
    day_format = "{w}, {d}.{m}."
    today = heute
    tomorrow = morgen
    in_days = "in %d Tagen"

    # The tabs.
    tab_now = Jetzt
    tab_forecast = Vorhersage
    tab_history = Verlauf
    tab_records = Rekorde
    tab_sky = Himmel
    tab_system = System

    # The periods of the records page, by the name of their Cheetah tag.
