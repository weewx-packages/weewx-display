#
# [Texts] holds the words of the display. station.json carries all of it, so the
# display needs no new firmware for a new language or a better word.

[Labels]
    [[Generic]]
        appTemp     = Feels like
        cloudbase   = Cloud base
        ET          = Evapotranspiration
        outHumidity = Humidity
        outTemp     = Outside
        windGust    = Gust
        windSpeed   = Wind

[Texts]
    # How the display writes a number.
    decimal_separator = "."

    # The words of the calendar, Sunday first.
    weekdays = Sun, Mon, Tue, Wed, Thu, Fri, Sat
    weekdays_long = Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday
    months = Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec
    # A date: {w} the weekday, {d} the day, {m} the month.
    day_format = "{w} {m}/{d}"
    today = today
    tomorrow = tomorrow
    in_days = "in %d days"

    # The tabs.
    tab_now = Now
    tab_forecast = Forecast
    tab_history = History
    tab_records = Records
    tab_sky = Sky
    tab_system = System

    # The periods of the records page, by the name of their Cheetah tag.
