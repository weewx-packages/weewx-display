###############################################################################
# SKIN Display: the data of the wall display                                  #
# Copyright (c) 2026 Manuel Hilgert                                           #
###############################################################################
#
# The display draws everything itself. This skin writes no page, only the data it
# draws, as JSON under the HTML_ROOT of the report:
#
#   station.json    The units, labels and texts. Read when the display starts.
#   summary.json    The archive record, the trends and the extremes of each period.
#   sky.json        The course of the sun and the phase of the moon.
#   forecast.json   The forecast. Written by the service DisplayForecast, not here.
#   data/           The history, from the JSON generator.
#
# The live readings come from the service DisplayLive, in a file in memory. The web
# server hands that out as live.json.

SKIN_NAME = Display
SKIN_VERSION = 0.1.0

[DisplayOptions]

    # The readings in summary.json. A type the station does not record is left out.
    observations = outTemp, appTemp, dewpoint, outHumidity, barometer, windSpeed, windGust, windDir, rainRate, radiation, UV, inTemp, inHumidity, cloudbase

    # The types whose lowest and highest value of each period summary.json holds. The
    # records page of the display shows them.
    extremes = outTemp, appTemp, dewpoint, outHumidity, barometer, windSpeed, windGust, rainRate, radiation, UV, inTemp, inHumidity

    # The types that are totals. summary.json holds their sum for each period.
    sums = rain, ET

    # The types that get a trend: the change over [Units][[Trend]] time_delta, which is
    # three hours unless set otherwise.
    trends = barometer, outTemp, outHumidity

    # The periods of summary.json, by the name of their Cheetah tag.
    periods = day, yesterday, week, month, year, alltime

    # The minutes between two points of the sun's curves in sky.json.
    sun_curve_step = 10

    # The time zone of the station as a POSIX TZ string. Default is the zone of the
    # machine that runs WeeWX.
    # tz = CET-1CEST,M3.5.0,M10.5.0/3

    # The charts of the history page, in their order on the display. Each name is a
    # plot group of [JSONGenerator]. Its title is the text 'chart_<name>' in the
    # language file.
    charts = temp, humidity, barometer, wind, rain, solar

    # How each chart is drawn: 'line' or 'bar'. A chart not listed is a line.
    [[ChartTypes]]
        rain = bar

    # The colors of the display, as #rrggbb. A color not set here keeps the built-in
    # dark theme. white_balance scales red, green and blue of every color, e.g.,
    # 1.0, 1.0, 0.9 for a panel with a blue cast.
    [[Theme]]
        # background = "#000000"
        # tile = "#161616"
        # raised = "#262626"
        # line = "#303030"
        # text = "#F4F4F4"
        # text_dim = "#9E9E9E"
        # text_faint = "#666666"
        # accent = "#F2A93B"
        # high = "#F26B5B"
        # low = "#5AAEF2"
        # sun = "#FFC24A"
        # white_balance = 1.0, 1.0, 1.0

[Units]
    [[Trend]]
        time_delta = 10800
        time_grace = 300

[CheetahGenerator]
    search_list_extensions = user.display.DisplaySky
    encoding = utf8

    [[ToDate]]
        [[[station]]]
            template = station.json.tmpl
        [[[summary]]]
            template = summary.json.tmpl
        [[[sky]]]
            template = sky.json.tmpl

[JSONGenerator]
    json_dest_dir = data

    # The plot groups of the history page. The display shows each one as a chart; the
    # series of a group share its axis.
    [[JSONFiles]]
        [[[temp]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]
        [[[humidity]]]
            [[[[outHumidity]]]]
        [[[barometer]]]
            [[[[barometer]]]]
        [[[wind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]
        [[[rain]]]
            aggregate_type = sum
            aggregate_interval = 1h
            [[[[rain]]]]
        [[[solar]]]
            [[[[radiation]]]]
            [[[[UV]]]]

    # The resolutions suit a screen 800 pixels wide, not a web page. The display draws
    # the day from the day tier, the week and the month from the month tier at one
    # hour, and the year from the year tier at one day. A day of the year tier carries
    # its lowest and highest value for the types in 'extremes', so the year chart shows
    # the band between them.
    [[Archive]]
        days = 2
        months = 2
        month_resolution = 1h
        years = 2
        year_resolution = 1d
        old_year_resolution = 1d
        extremes = outTemp, dewpoint, outHumidity, barometer, windSpeed, windGust, radiation, UV
        budget = 30

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, user.jsongenerator.JSONGenerator
